name: Tests y despliegue Backend en Render

on:
  push:
    branches:
      - main
  # Las pruebas y el lint también corren en cada PR hacia main o rediseno (SGDE-55).
  # El deploy no: ver "if" abajo.
  pull_request:
    branches:
      - main
      - rediseno
  workflow_dispatch:

jobs:
  test:
    name: Pruebas del backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        # Login a Docker Hub para evitar el límite de descargas anónimas (toomanyrequests).
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: sgde_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Valores descartables solo para CI; no son secretos reales.
      SECRET_KEY: clave-descartable-solo-para-ci
      DB_NAME: sgde_db
      DB_USER: postgres
      DB_PASSWORD: postgres-ci
      DB_HOST: localhost
      DB_PORT: 5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Correr pruebas
        working-directory: backend
        run: python manage.py test

  # Lint del frontend (SGDE-55): falla si hay errores de ESLint; las advertencias
  # no lo frenan. No bloquea el deploy, que sigue dependiendo solo de "test".
  lint-frontend:
    name: Lint del frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Correr ESLint
        working-directory: frontend
        run: npm run lint

  deploy:
    name: Desplegar a Render
    needs: test
    # Solo un push (o ejecución manual) sobre main despliega; los PRs nunca.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl --fail -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
