<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Marca de la barra superior (dashboard-layout.css, barra-superior__marca).
       Un SVG suelto no lee variables CSS: los colores de tokens.css van escritos a mano:
       fondo de la marca = color-texto, letra = color-fondo, punto = color-mandarina,
       anillo del punto = color-superficie. (Sin guiones dobles: XML no los admite en un comentario.) -->
  <rect x="0" y="6" width="34" height="34" rx="10" fill="#1D232B"/>
  <text x="17" y="30.5" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="21" font-weight="800" fill="#F3F2F0">S</text>
  <circle cx="32" cy="8" r="7" fill="#FFFFFF"/>
  <circle cx="32" cy="8" r="5" fill="#EE8A63"/>
</svg>
